is_brats2021: False
is_brain2019: False #True
is_brain2019_small: False
is_hepatic_vessel2021: False
is_heart: True

is_acute: False

is_lung: False 
is_lung_big_model: False

is_tbad_dataset: False #True

is_aneurysms: True



brats2021:
  data_root: ../med_data/common/BraTS2020_gz/TrainingData 
  device: cuda1
  trainer:
    seed: 50
    num_epochs: 300
    warmup: 5
    train_ratio: 0.8
    batch_size: 8
    lr: 0.001
    min_lr: 0.0000001
    optimizer: adamw
    weight_decay: 0.05
    weight_decay_end: 0.04
    momentum_teacher: 0.996
    pred_ratio_var: 0
    num_workers: 0

    rot_prob: 0.7
    rot_angle: 0.62830 # 2*pi/10
    flip_prob: 0.2

    dice_loss_ratio: 1.
    focal_class_weights: [0.8, 0.9, 1.5]
    focal_loss_ratio: 0.8
    gamma: 2.0

    start_unlab_epoch_ratio: 0.1
    unlabled_ratio: 0.0
    unlab_weight: 0.3
    only_labeled: False
    use_transform: False
    
    image_size: 128
    resume: True

  finetune:
    checkpoint: brain2021
  model: unet   
  slim_unetr:
    in_channels: 4
    out_channels: 3
    embed_dim: 96 
    embedding_dim: 64 
    channels: [ 24, 48, 60 ]
    blocks: [ 1, 2, 3, 2 ]
    heads: [ 1, 2, 4, 4 ]
    r: [ 4, 2, 2, 1 ]
    dropout: 0.3
    use_split_classes: False

